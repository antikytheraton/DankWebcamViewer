# $schema: https://json.schemastore.org/github-workflow.json

name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run plugin tests
        if: ${{ hashFiles('test.sh') != '' }}
        run: bash test.sh

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Warn if tag mismatches plugin.json
        run: |
          PLUGIN=$(python -c "import json; print(json.load(open('plugin.json'))['version'])")
          if [ "$PLUGIN" != "${{ steps.version.outputs.version }}" ]; then
            echo "::warning::tag v${{ steps.version.outputs.version }} != plugin.json $PLUGIN"
          fi

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --draft=false \
              --prerelease=false \
              --latest \
              --verify-tag
          else
            gh release create "${TAG}" \
              --latest \
              --target "${TAG}" \
              --verify-tag \
              --generate-notes
          fi
